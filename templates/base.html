<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Smart Fertilizer Advisory{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head><body>
{% if session.get('user_id') %}
<header><div class="brand">🌱 Smart Fertilizer Advisory System</div><nav>
<a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('history') }}">History</a><a href="{{ url_for('shops') }}">Fertilizer Shops</a><a href="{{ url_for('logout') }}" class="logout">Logout</a>
</nav></header>
{% endif %}
<main>{% with messages=get_flashed_messages() %}{% if messages %}<div class="flash">{% for m in messages %}<div>{{m}}</div>{% endfor %}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}</main>
</body></html>
